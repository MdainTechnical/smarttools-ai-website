<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>URL Safety Checker — SmartTools AI</title><link rel="stylesheet" href="phishing.css"></head><body><main class="page"><div class="topbar"><a class="back" href="../index.html">← SmartTools AI</a><span class="muted">SECURITY</span></div><header><span class="muted">WEB PROTECTION</span><h1 class="title">URL Safety Checker</h1><p class="subtitle">Check a website before you visit it.</p></header><section class="panel" style="margin-top:30px"><label class="label" for="url">Website URL</label><input id="url" class="input" type="url" placeholder="https://example.com" autocomplete="url"><div class="toolbar"><span class="muted">We never automatically open the submitted URL.</span><button id="scan" class="btn primary">Scan Website →</button></div><div id="error" class="error" role="alert"></div><div id="loading" class="loading"><span class="spinner"></span>Scanning website...</div></section><section id="result" class="panel result" aria-live="polite"><div id="icon" class="result-icon">🟢</div><div id="headline" class="headline">SAFE</div><p id="message" class="message">Website appears safe.</p><div class="details"><div>Domain<strong id="domain">—</strong></div><div>HTTP Status<strong id="status">—</strong></div><div>Detection<strong id="detection">—</strong></div></div></section></main><script src="phishing.js"></script></body></html>
