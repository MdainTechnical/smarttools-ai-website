<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AI Content Detector — SmartTools AI</title><link rel="stylesheet" href="ai-detector.css"></head><body><main class="page"><div class="topbar"><a class="back" href="../index.html">← SmartTools AI</a><span class="muted">AI POWERED</span></div><header><span class="muted">CONTENT INTELLIGENCE</span><h1 class="title">AI Content Detector</h1><p class="subtitle">Analyze your text using AI-powered detection.</p></header><section class="panel" style="margin-top:30px"><label class="label" for="textInput">Your text</label><textarea id="textInput" class="textarea" placeholder="Paste your text here..." aria-label="Text to analyze"></textarea><div class="toolbar"><span id="wordCount" class="muted">Words: 0 · Minimum required: 30 words</span><button id="analyzeBtn" class="btn primary">Analyze Text →</button></div><div id="error" class="error" role="alert"></div><div id="loading" class="loading"><span class="spinner"></span>Analyzing your text...</div></section><section id="result" class="panel result" aria-live="polite"><div class="score-wrap"><div id="scoreRing" class="score-ring"><div><strong id="score">0%</strong><span class="muted">AI score</span></div></div><div><span class="muted">AI DETECTION RESULT</span><div id="verdict" class="verdict">—</div><p class="muted">Model detection: <b id="model">—</b> · Confidence <b id="confidence">—</b></p></div></div><div class="distribution"><span class="muted">MODEL DISTRIBUTION</span><div id="distributionRows"></div></div><div class="actions"><button id="againBtn" class="btn primary">Analyze Again</button><button id="clearBtn" class="btn">Clear Text</button></div></section></main><script src="ai-detector.js"></script></body></html>
